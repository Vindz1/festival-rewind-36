name: Maintenir Supabase actif

on:
  schedule:
    - cron: '0 */6 * * *'  # Toutes les 6 heures
  workflow_dispatch:       # Permet de tester manuellement

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase directement
        run: |
          echo "Ping de Supabase..."
          curl -sf \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://aeszjksdwruotsudgixm.supabase.co/rest/v1/festivals?limit=1" \
            > /dev/null
          echo "✓ Supabase pingé avec succès!"
